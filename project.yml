name: CulinaryPassport
options:
  bundleIdPrefix: app.culinarypassport
  deploymentTarget:
    iOS: "17.0"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

targets:
  CulinaryPassport:
    type: application
    platform: iOS
    sources: [CulinaryPassport]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1" # phone-first product; iPad runs the scaled iPhone app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: CulinaryPassport/Info.plist
      properties:
        # Home-screen name. The bundle id and culinarypassport:// scheme stay —
        # they're wired into Supabase auth redirects and are never user-visible.
        CFBundleDisplayName: Stampd
        # Brand-green system launch frame (storyboard — UIColorName silently
        # falls back to white on the simulator), so the splash overlay picks
        # up from an identical green first frame with zero flash.
        UILaunchStoryboardName: LaunchScreen
        # Portrait-only + full screen: silences the "all interface orientations
        # must be supported" warning without pretending to support landscape.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSCameraUsageDescription: "Take photos of your meals, and for your profile."
        NSLocationWhenInUseUsageDescription: "Stampd uses your location to find restaurants near you when you spin the globe or log a meal. It isn't stored or shared."
        # Read access powers "Find countries in my photos" — locations are read
        # on-device and nothing is uploaded unless the user posts a memory.
        NSPhotoLibraryUsageDescription: "Stampd reads where a meal photo was taken to find the restaurant you ate at. This happens on your phone; a photo is only uploaded when you add it to a meal."
        # Config.swift reads these; values come from Config.xcconfig at build time
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        # OAuth redirect scheme (Google web flow / any provider deep-link callback)
        CFBundleURLTypes:
          - CFBundleURLName: app.culinarypassport.auth
            CFBundleURLSchemes: [culinarypassport]

  CulinaryPassportTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CulinaryPassportTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CulinaryPassport
