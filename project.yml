name: CulinaryPassport
options:
  bundleIdPrefix: app.culinarypassport
  deploymentTarget:
    iOS: "17.0"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

targets:
  CulinaryPassport:
    type: application
    platform: iOS
    sources: [CulinaryPassport]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1" # phone-first product; iPad runs the scaled iPhone app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: CulinaryPassport/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchPaper
        # Portrait-only + full screen: silences the "all interface orientations
        # must be supported" warning without pretending to support landscape.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSCameraUsageDescription: "Take a selfie to generate your avatar, and snap your meals."
        NSPhotoLibraryUsageDescription: "Attach photos of your meals."
        NSLocationWhenInUseUsageDescription: "Find restaurants serving tonight's cuisine near you."
        # Config.swift reads these; values come from Config.xcconfig at build time
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        # OAuth redirect scheme (Google web flow / any provider deep-link callback)
        CFBundleURLTypes:
          - CFBundleURLName: app.culinarypassport.auth
            CFBundleURLSchemes: [culinarypassport]

  CulinaryPassportTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CulinaryPassportTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CulinaryPassport
