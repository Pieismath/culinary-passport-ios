name: CulinaryPassport
options:
  bundleIdPrefix: app.culinarypassport
  deploymentTarget:
    iOS: "17.0"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

targets:
  CulinaryPassport:
    type: application
    platform: iOS
    sources: [CulinaryPassport]
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Take a selfie to generate your avatar, and snap your meals."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Attach photos of your meals."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Find restaurants serving tonight's cuisine near you."
